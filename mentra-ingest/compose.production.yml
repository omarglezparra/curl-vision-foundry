services:
  ingest:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RECORDINGS_ROOT: /recordings
      MEDIAMTX_CONFIG: /mediamtx.production.yml
      INGEST_HEALTHCHECK_MODE: rtmps
      INGEST_HEALTHCHECK_PORT: "1936"
      MTX_RTMPENCRYPTION: strict
      RTMPS_DOMAIN: ${RTMPS_DOMAIN:?Set RTMPS_DOMAIN to the certificate DNS name}
      FAILED_SEGMENT_RETENTION_SECONDS: ${FAILED_SEGMENT_RETENTION_SECONDS:-86400}
      RETRY_WORKER_HEARTBEAT_PATH: /recordings/.retry-worker-heartbeat
      RETRY_WORKER_HEALTH_MAX_AGE_SECONDS: ${RETRY_WORKER_HEALTH_MAX_AGE_SECONDS:-300}
    ports:
      - "1936:1936/tcp"
    volumes:
      - type: volume
        source: mentra_recordings
        target: /recordings
      - type: bind
        source: ${RTMPS_CERT_DIR:?Set RTMPS_CERT_DIR to the host certificate directory}
        target: /certs
        read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mentra_recordings:
