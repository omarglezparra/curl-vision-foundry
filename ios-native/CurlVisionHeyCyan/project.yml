name: CurlVisionHeyCyan
options:
  minimumXcodeGenVersion: 2.39.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
    MARKETING_VERSION: "$(MARKETING_VERSION)"
    CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CurlVisionHeyCyan:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Curl Vision HeyCyan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSBluetoothAlwaysUsageDescription: Curl Vision connects to HeyCyan/BV100 glasses to control workout recording.
        NSLocalNetworkUsageDescription: Curl Vision connects to the glasses WiFi hotspot to download workout videos.
        NSPhotoLibraryAddUsageDescription: Curl Vision saves imported workout clips and metadata when requested.
        UIBackgroundModes:
          - bluetooth-central
    entitlements:
      path: Sources/CurlVisionHeyCyan.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/CurlVisionHeyCyan.entitlements
